<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Inter, Arial, sans-serif">
  <title>Ultraschall – Impuls-Echo-Verfahren und elektronische Fokussierung</title>
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b2545"/>
    </marker>
    <marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>

  <!-- Panel A -->
  <text x="150" y="26" font-size="15" font-weight="600" fill="#0b2545" text-anchor="middle">A  Impuls-Echo-Verfahren</text>

  <!-- Schallkopf -->
  <rect x="58" y="44" width="64" height="22" rx="3" fill="#14b8a6" stroke="#0b2545" stroke-width="1.5"/>
  <text x="90" y="60" font-size="13" fill="#ffffff" text-anchor="middle">Wandler</text>
  <!-- Gewebeschichten -->
  <rect x="40" y="70" width="100" height="80" fill="#f1f5f9" stroke="#0b2545" stroke-width="1"/>
  <rect x="40" y="150" width="100" height="90" fill="#e6f7f5" stroke="#0b2545" stroke-width="1"/>
  <rect x="40" y="240" width="100" height="70" fill="#f1f5f9" stroke="#0b2545" stroke-width="1"/>
  <line x1="40" y1="150" x2="140" y2="150" stroke="#0b2545" stroke-width="2.5"/>
  <line x1="40" y1="240" x2="140" y2="240" stroke="#0b2545" stroke-width="2.5"/>
  <text x="90" y="114" font-size="13" fill="#0b2545" text-anchor="middle">Gewebe 1</text>
  <text x="90" y="200" font-size="13" fill="#0b2545" text-anchor="middle">Gewebe 2</text>
  <text x="90" y="280" font-size="13" fill="#0b2545" text-anchor="middle">Gewebe 3</text>
  <!-- Puls und Echos -->
  <line x1="72" y1="74" x2="72" y2="144" stroke="#0b2545" stroke-width="1.5" marker-end="url(#pf)"/>
  <line x1="108" y1="146" x2="108" y2="78" stroke="#0d9488" stroke-width="1.5" marker-end="url(#pt)"/>
  <line x1="122" y1="236" x2="122" y2="78" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pt)"/>

  <!-- A-Mode-Kurve (Tiefe nach unten) -->
  <line x1="170" y1="66" x2="170" y2="316" stroke="#0b2545" stroke-width="1.5" marker-end="url(#pf)"/>
  <line x1="170" y1="66" x2="286" y2="66" stroke="#0b2545" stroke-width="1.5" marker-end="url(#pf)"/>
  <text x="228" y="58" font-size="13" fill="#0b2545" text-anchor="middle">Echoamplitude</text>
  <text x="174" y="330" font-size="13" fill="#0b2545">Laufzeit t ∝ Tiefe d</text>
  <path d="M170,72 L180,70 L170,80 L172,140 L176,144 L250,150 L176,156 L172,160 L171,234 L174,237 L215,240 L174,243 L171,246 L170,306" fill="none" stroke="#0d9488" stroke-width="2"/>
  <line x1="140" y1="150" x2="168" y2="150" stroke="#0b2545" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="140" y1="240" x2="168" y2="240" stroke="#0b2545" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="256" y="154" font-size="13" fill="#0b2545">Echo 1</text>
  <text x="221" y="244" font-size="13" fill="#0b2545">Echo 2</text>
  <text x="200" y="270" font-size="13" fill="#0b2545">(gedämpft)</text>

  <!-- Formeln A -->
  <text x="150" y="356" font-size="14" fill="#0b2545" text-anchor="middle">d = c · t / 2</text>
  <text x="150" y="378" font-size="13" fill="#0b2545" text-anchor="middle">c ≈ 1540 m/s → t ≈ 13 µs pro cm</text>

  <!-- Trennlinie -->
  <line x1="306" y1="40" x2="306" y2="384" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Panel B -->
  <text x="455" y="26" font-size="15" font-weight="600" fill="#0b2545" text-anchor="middle">B  Elektronische Fokussierung</text>
  <!-- Verzögerungsbalken -->
  <g fill="#e6f7f5" stroke="#0d9488" stroke-width="1.2">
    <rect x="350" y="96" width="16" height="4"/>
    <rect x="374" y="88" width="16" height="12"/>
    <rect x="398" y="81" width="16" height="19"/>
    <rect x="422" y="77" width="16" height="23"/>
    <rect x="446" y="75" width="16" height="25"/>
    <rect x="470" y="77" width="16" height="23"/>
    <rect x="494" y="81" width="16" height="19"/>
    <rect x="518" y="88" width="16" height="12"/>
    <rect x="542" y="96" width="16" height="4"/>
  </g>
  <text x="454" y="62" font-size="13" fill="#0b2545" text-anchor="middle">Sendeverzögerung τᵢ je Element</text>
  <!-- Elemente -->
  <g fill="#14b8a6" stroke="#0b2545" stroke-width="1.2">
    <rect x="350" y="104" width="16" height="14"/><rect x="374" y="104" width="16" height="14"/>
    <rect x="398" y="104" width="16" height="14"/><rect x="422" y="104" width="16" height="14"/>
    <rect x="446" y="104" width="16" height="14"/><rect x="470" y="104" width="16" height="14"/>
    <rect x="494" y="104" width="16" height="14"/><rect x="518" y="104" width="16" height="14"/>
    <rect x="542" y="104" width="16" height="14"/>
  </g>
  <text x="344" y="115" font-size="13" fill="#0b2545" text-anchor="end">Array</text>
  <!-- Wellenfronten, zentriert auf den Fokus (454,290) -->
  <g fill="none" stroke="#0b2545" stroke-width="1.5">
    <path d="M363,158 A160,160 0 0 1 545,158"/>
    <path d="M384,195 A118,118 0 0 1 524,195"/>
    <path d="M407,238 A70,70 0 0 1 501,238"/>
  </g>
  <!-- Strahlbegrenzung -->
  <g stroke="#0d9488" stroke-width="1" stroke-dasharray="4 4">
    <line x1="350" y1="120" x2="454" y2="290"/>
    <line x1="558" y1="120" x2="454" y2="290"/>
    <line x1="454" y1="290" x2="400" y2="370"/>
    <line x1="454" y1="290" x2="508" y2="370"/>
  </g>
  <circle cx="454" cy="290" r="5" fill="#0d9488" stroke="#0b2545" stroke-width="1.5"/>
  <line x1="460" y1="292" x2="516" y2="300" stroke="#0b2545" stroke-width="1"/>
  <text x="520" y="304" font-size="13" fill="#0b2545">Fokus</text>
  <text x="548" y="186" font-size="13" fill="#0b2545">Wellen-</text>
  <text x="548" y="202" font-size="13" fill="#0b2545">fronten</text>
  <text x="454" y="390" font-size="13" fill="#0b2545" text-anchor="middle">äußere Elemente senden zuerst</text>
</svg>
