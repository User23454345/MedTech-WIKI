<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Inter, Arial, sans-serif">
  <title>Patientenmonitor – schematischer Aufbau</title>
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <text x="300" y="26" font-size="15" font-weight="600" fill="#0b2545" text-anchor="middle">Patientenmonitor – schematischer Aufbau</text>

  <!-- Gehäuse -->
  <rect x="190" y="60" width="250" height="200" rx="12" fill="#f1f5f9" stroke="#0b2545" stroke-width="2"/>
  <!-- Display -->
  <rect x="205" y="75" width="175" height="135" rx="4" fill="#0b2545" stroke="#0b2545" stroke-width="1.5"/>
  <!-- EKG-Kurve -->
  <polyline points="212,100 232,100 237,96 242,100 250,100 254,104 258,82 262,110 266,100 280,100 286,95 292,100 312,100 317,96 322,100 330,100 334,104 338,82 342,110 346,100 360,100 366,95 372,100" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
  <!-- Pleth-Kurve -->
  <path d="M212,140 C222,140 226,122 234,122 C242,122 244,136 250,136 C256,136 258,140 266,140 C276,140 280,122 288,122 C296,122 298,136 304,136 C310,136 312,140 320,140 C330,140 334,122 342,122 C350,122 352,136 358,136 C364,136 366,140 372,140" fill="none" stroke="#e6f7f5" stroke-width="1.5"/>
  <!-- NIBP-Zahl als Balken -->
  <rect x="212" y="160" width="70" height="14" rx="2" fill="#0d9488"/>
  <rect x="212" y="182" width="50" height="14" rx="2" fill="#0d9488" opacity="0.6"/>
  <rect x="300" y="160" width="70" height="36" rx="2" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
  <!-- Modulschacht -->
  <rect x="390" y="75" width="38" height="135" rx="3" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <line x1="390" y1="109" x2="428" y2="109" stroke="#0b2545" stroke-width="1.5"/>
  <line x1="390" y1="143" x2="428" y2="143" stroke="#0b2545" stroke-width="1.5"/>
  <line x1="390" y1="177" x2="428" y2="177" stroke="#0b2545" stroke-width="1.5"/>
  <!-- Bedienleiste -->
  <circle cx="225" cy="235" r="8" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <circle cx="250" cy="235" r="8" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <rect x="330" y="227" width="50" height="16" rx="3" fill="#0d9488"/>
  <!-- Alarmleuchte -->
  <rect x="290" y="48" width="50" height="12" rx="5" fill="#14b8a6" stroke="#0b2545" stroke-width="1.5"/>

  <!-- Innenleben unten -->
  <rect x="190" y="290" width="115" height="50" rx="6" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="247" y="312" font-size="13" fill="#0b2545" text-anchor="middle">Netzteil</text>
  <text x="247" y="328" font-size="13" fill="#0b2545" text-anchor="middle">(Schutzklasse I)</text>
  <rect x="325" y="290" width="115" height="50" rx="6" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="382" y="312" font-size="13" fill="#0b2545" text-anchor="middle">Li-Ionen-Akku</text>
  <text x="382" y="328" font-size="13" fill="#0b2545" text-anchor="middle">(Pufferbetrieb)</text>
  <line x1="247" y1="290" x2="247" y2="260" stroke="#0b2545" stroke-width="1.5"/>
  <line x1="382" y1="290" x2="382" y2="260" stroke="#0b2545" stroke-width="1.5"/>

  <!-- Patientenkabel links -->
  <g stroke="#0d9488" stroke-width="2" fill="none">
    <path d="M190,110 C150,110 140,90 110,90"/>
    <path d="M190,150 C150,150 140,140 110,140"/>
    <path d="M190,190 C150,190 140,190 110,190"/>
    <path d="M190,225 C150,225 140,240 110,240"/>
  </g>
  <g font-size="13" fill="#0b2545" text-anchor="end">
    <text x="104" y="94">EKG-Elektroden</text>
    <text x="104" y="144">SpO₂-Sensor</text>
    <text x="104" y="194">NIBP-Manschette</text>
    <text x="104" y="244">Temperaturfühler</text>
  </g>
  <text x="20" y="275" font-size="13" fill="#0b2545">Anwendungsteile</text>
  <text x="20" y="291" font-size="13" fill="#0b2545">(Typ BF/CF, galvanisch</text>
  <text x="20" y="307" font-size="13" fill="#0b2545">getrennt)</text>

  <!-- Netzwerk rechts -->
  <path d="M440,160 L500,160" stroke="#0b2545" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <rect x="500" y="135" width="85" height="50" rx="6" fill="#f1f5f9" stroke="#0b2545" stroke-width="1.5"/>
  <text x="542" y="156" font-size="13" fill="#0b2545" text-anchor="middle">Zentrale /</text>
  <text x="542" y="172" font-size="13" fill="#0b2545" text-anchor="middle">PDMS</text>
  <text x="470" y="152" font-size="13" fill="#0b2545" text-anchor="middle">LAN</text>

  <!-- Beschriftungen mit Führungslinien -->
  <line x1="315" y1="48" x2="470" y2="48" stroke="#0b2545" stroke-width="1.5"/>
  <text x="474" y="52" font-size="13" fill="#0b2545">optische Alarmanzeige</text>
  <line x1="428" y1="92" x2="470" y2="92" stroke="#0b2545" stroke-width="1.5"/>
  <text x="474" y="96" font-size="13" fill="#0b2545">Parametermodule</text>
  <line x1="372" y1="100" x2="372" y2="68" stroke="#0b2545" stroke-width="1"/>
  <text x="474" y="72" font-size="13" fill="#0b2545">Kurvenbereich</text>
  <line x1="372" y1="68" x2="470" y2="68" stroke="#0b2545" stroke-width="1"/>
  <line x1="380" y1="235" x2="470" y2="235" stroke="#0b2545" stroke-width="1.5"/>
  <text x="474" y="239" font-size="13" fill="#0b2545">Bedienelemente /</text>
  <text x="474" y="255" font-size="13" fill="#0b2545">Alarmquittierung</text>

  <text x="300" y="380" font-size="13" fill="#0b2545" text-anchor="middle">Funktionsschema, keine Abbildung eines konkreten Modells</text>
</svg>
