<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Inter, Arial, sans-serif">
  <title>Elektrokardiograph – Messprinzip: Einthoven-Dreieck und EKG-Zyklus</title>
  <defs>
    <marker id="pf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <pattern id="raster" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10,0 L0,0 L0,10" fill="none" stroke="#e6f7f5" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>

  <!-- A Einthoven -->
  <text x="140" y="28" font-size="15" font-weight="600" fill="#0b2545" text-anchor="middle">A  Einthoven-Dreieck</text>
  <polygon points="50,70 230,70 140,226" fill="#f1f5f9" stroke="#0b2545" stroke-width="2"/>
  <path d="M128,128 q12,-12 22,0 q8,18 -14,34 q-20,-16 -8,-34 z" fill="#e6f7f5" stroke="#0d9488" stroke-width="1.5"/>
  <line x1="122" y1="160" x2="160" y2="128" stroke="#0d9488" stroke-width="2" marker-end="url(#pf2)"/>
  <text x="172" y="150" font-size="13" fill="#0d9488">Herzvektor</text>
  <g fill="#14b8a6" stroke="#0b2545" stroke-width="1.5">
    <circle cx="50" cy="70" r="6"/><circle cx="230" cy="70" r="6"/><circle cx="140" cy="226" r="6"/>
  </g>
  <g font-size="13" fill="#0b2545">
    <text x="30" y="60">R</text><text x="240" y="60">L</text><text x="150" y="246">F</text>
    <text x="140" y="62" text-anchor="middle" font-weight="600">I</text>
    <text x="78" y="160" text-anchor="end" font-weight="600">II</text>
    <text x="202" y="160" font-weight="600">III</text>
  </g>
  <g font-size="13" fill="#0b2545">
    <text x="20" y="282">I = Φ_L − Φ_R</text>
    <text x="20" y="302">II = Φ_F − Φ_R</text>
    <text x="20" y="322">III = Φ_F − Φ_L   →   II = I + III</text>
    <text x="20" y="348">WCT = (Φ_R + Φ_L + Φ_F) / 3</text>
    <text x="20" y="368">Vi = Φ_Vi − WCT  (i = 1 … 6)</text>
  </g>

  <line x1="300" y1="44" x2="300" y2="380" stroke="#f1f5f9" stroke-width="2"/>

  <!-- B EKG-Zyklus -->
  <text x="450" y="28" font-size="15" font-weight="600" fill="#0b2545" text-anchor="middle">B  EKG-Zyklus (25 mm/s)</text>
  <rect x="320" y="60" width="260" height="200" fill="url(#raster)" stroke="#14b8a6" stroke-width="1"/>
  <path d="M320,200 L350,200 Q362,184 374,200 L392,200 L398,208 L410,90 L420,220 L428,200 L456,200 Q478,166 500,200 L528,200"
        fill="none" stroke="#0b2545" stroke-width="2"/>
  <g font-size="13" fill="#0b2545" text-anchor="middle">
    <text x="362" y="178">P</text>
    <text x="398" y="224">Q</text>
    <text x="410" y="82">R</text>
    <text x="424" y="238">S</text>
    <text x="478" y="160">T</text>
  </g>
  <!-- Intervalle -->
  <g stroke="#0d9488" stroke-width="1.5">
    <line x1="350" y1="276" x2="398" y2="276"/>
    <line x1="350" y1="270" x2="350" y2="282"/><line x1="398" y1="270" x2="398" y2="282"/>
    <line x1="398" y1="306" x2="428" y2="306"/>
    <line x1="398" y1="300" x2="398" y2="312"/><line x1="428" y1="300" x2="428" y2="312"/>
    <line x1="398" y1="336" x2="502" y2="336"/>
    <line x1="398" y1="330" x2="398" y2="342"/><line x1="502" y1="330" x2="502" y2="342"/>
  </g>
  <g font-size="13" fill="#0b2545">
    <text x="410" y="281">PQ-Zeit</text>
    <text x="440" y="311">QRS-Dauer</text>
    <text x="514" y="341">QT-Zeit</text>
  </g>
  <!-- Eichmaßstab -->
  <g stroke="#0b2545" stroke-width="1.5" fill="none">
    <path d="M536,200 L545,200 L545,100 L565,100 L565,200 L574,200"/>
  </g>
  <text x="555" y="92" font-size="13" fill="#0b2545" text-anchor="middle">1 mV</text>
  <text x="450" y="370" font-size="13" fill="#0b2545" text-anchor="middle">1 mm = 40 ms · 10 mm = 1 mV (schematisch)</text>
</svg>
