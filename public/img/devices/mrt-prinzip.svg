<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Inter, Arial, sans-serif">
  <title>MRT – Messprinzip: Präzession, Relaxation und Schichtselektion</title>
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b2545"/>
    </marker>
    <marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>

  <!-- Panel A: Präzession -->
  <text x="20" y="24" font-size="15" font-weight="600" fill="#0b2545">A  Präzession und Anregung</text>
  <line x1="110" y1="180" x2="110" y2="44" stroke="#0b2545" stroke-width="2" marker-end="url(#pf)"/>
  <text x="118" y="52" font-size="14" fill="#0b2545">B₀ (z)</text>
  <ellipse cx="110" cy="92" rx="52" ry="14" fill="#e6f7f5" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="110" y1="160" x2="158" y2="96" stroke="#0d9488" stroke-width="2.5" marker-end="url(#pt)"/>
  <text x="164" y="100" font-size="14" fill="#0d9488">M</text>
  <path d="M60,96 Q64,108 80,106" fill="none" stroke="#0b2545" stroke-width="1.5" marker-end="url(#pf)"/>
  <text x="28" y="128" font-size="13" fill="#0b2545">Präzession</text>
  <text x="28" y="144" font-size="13" fill="#0b2545">mit ω₀</text>
  <line x1="110" y1="160" x2="200" y2="160" stroke="#0b2545" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#pf)"/>
  <text x="206" y="164" font-size="13" fill="#0b2545">B₁ (HF)</text>
  <circle cx="110" cy="160" r="4" fill="#0b2545"/>
  <text x="28" y="190" font-size="14" fill="#0b2545">ω₀ = γ · B₀</text>
  <text x="150" y="190" font-size="13" fill="#0b2545">α = γ · B₁ · τ</text>

  <!-- Panel B: Relaxation -->
  <text x="320" y="24" font-size="15" font-weight="600" fill="#0b2545">B  Relaxation nach 90°-Puls</text>
  <line x1="340" y1="176" x2="340" y2="44" stroke="#0b2545" stroke-width="1.5" marker-end="url(#pf)"/>
  <line x1="340" y1="176" x2="580" y2="176" stroke="#0b2545" stroke-width="1.5" marker-end="url(#pf)"/>
  <text x="566" y="194" font-size="13" fill="#0b2545">t</text>
  <line x1="336" y1="60" x2="574" y2="60" stroke="#0b2545" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="314" y="64" font-size="13" fill="#0b2545">M₀</text>
  <!-- T1-Erholung Mz -->
  <path d="M340,176 C380,110 420,82 470,70 S550,62 570,61" fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <text x="474" y="92" font-size="13" fill="#0d9488">M_z: T1-Erholung</text>
  <!-- T2-Zerfall Mxy -->
  <path d="M340,60 C360,110 380,150 420,166 S520,175 570,175" fill="none" stroke="#0b2545" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="404" y="150" font-size="13" fill="#0b2545">M_xy: T2-Zerfall</text>
  <text x="344" y="194" font-size="13" fill="#0b2545">M_z = M₀(1 − e^(−t/T1))</text>

  <!-- Trennlinie -->
  <line x1="20" y1="212" x2="580" y2="212" stroke="#0b2545" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Panel C: Schichtselektion -->
  <text x="20" y="236" font-size="15" font-weight="600" fill="#0b2545">C  Schichtselektion mit Gradientenfeld</text>
  <line x1="90" y1="380" x2="90" y2="252" stroke="#0b2545" stroke-width="1.5" marker-end="url(#pf)"/>
  <line x1="90" y1="380" x2="360" y2="380" stroke="#0b2545" stroke-width="1.5" marker-end="url(#pf)"/>
  <text x="26" y="264" font-size="13" fill="#0b2545">Frequenz</text>
  <text x="26" y="280" font-size="13" fill="#0b2545">f(z)</text>
  <text x="346" y="370" font-size="13" fill="#0b2545">z</text>
  <!-- Schichtband -->
  <rect x="200" y="252" width="40" height="128" fill="#e6f7f5" stroke="none"/>
  <rect x="90" y="306" width="150" height="22" fill="#e6f7f5" stroke="none"/>
  <line x1="90" y1="306" x2="200" y2="306" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="90" y1="328" x2="240" y2="328" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="200" y1="306" x2="200" y2="380" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="240" y1="328" x2="240" y2="380" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Gerade f(z) -->
  <line x1="100" y1="372" x2="340" y2="262" stroke="#0b2545" stroke-width="2.5"/>
  <text x="94" y="320" font-size="13" fill="#0d9488">Δf</text>
  <text x="208" y="396" font-size="13" fill="#0d9488">Δz</text>
  <text x="262" y="338" font-size="13" fill="#0b2545">Steigung ∝ G_z</text>

  <!-- Formeln -->
  <rect x="368" y="250" width="222" height="130" rx="6" fill="#f1f5f9" stroke="#0b2545" stroke-width="1.5"/>
  <text x="378" y="274" font-size="13" fill="#0b2545">f(z) = (γ/2π) · (B₀ + G_z · z)</text>
  <text x="378" y="300" font-size="13" fill="#0b2545">Δz = Δf / ((γ/2π) · G_z)</text>
  <text x="378" y="326" font-size="13" fill="#0b2545">γ/2π ≈ 42,58 MHz/T (¹H)</text>
  <text x="378" y="352" font-size="13" fill="#0b2545">Nur Spins mit passender</text>
  <text x="378" y="368" font-size="13" fill="#0b2545">Frequenz werden angeregt.</text>
</svg>
