<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0b2545">
  <title>Wärmebilanz des Neugeborenen und Temperaturregelkreis im Inkubator</title>
  <defs>
    <marker id="inp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="inp-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b2545"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="600">Prinzip: Wärmebilanz und Temperaturregelung</text>

  <!-- Linkes Feld: Wärmebilanz -->
  <text x="150" y="54" text-anchor="middle" font-size="14" font-weight="600">Wärmebilanz des Kindes</text>
  <rect x="30" y="66" width="240" height="210" rx="8" fill="#f1f5f9" stroke="#0b2545" stroke-width="2"/>
  <text x="262" y="84" text-anchor="end" font-size="12">Innenwand T_Wand</text>
  <rect x="55" y="216" width="190" height="12" rx="3" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <circle cx="100" cy="201" r="13" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
  <ellipse cx="160" cy="203" rx="48" ry="13" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
  <text x="160" y="208" text-anchor="middle" font-size="13" font-weight="600">M</text>

  <line x1="160" y1="188" x2="160" y2="132" stroke="#0d9488" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#inp-arr)"/>
  <text x="160" y="106" text-anchor="middle" font-size="13">Q_E</text>
  <text x="160" y="121" text-anchor="middle" font-size="13">Verdunstung</text>
  <line x1="122" y1="192" x2="80" y2="170" stroke="#0d9488" stroke-width="2" marker-end="url(#inp-arr)"/>
  <text x="40" y="150" font-size="13">Q_C</text>
  <text x="40" y="164" font-size="13">Konvektion</text>
  <line x1="200" y1="193" x2="262" y2="150" stroke="#0d9488" stroke-width="2" marker-end="url(#inp-arr)"/>
  <text x="204" y="118" font-size="13">Q_R</text>
  <text x="204" y="133" font-size="13">Strahlung</text>
  <line x1="160" y1="217" x2="160" y2="256" stroke="#0d9488" stroke-width="2" marker-end="url(#inp-arr)"/>
  <text x="168" y="254" font-size="12">Q_K Konduktion</text>

  <text x="150" y="304" text-anchor="middle" font-size="13">S = M − (Q_K + Q_C + Q_R + Q_E)</text>
  <text x="150" y="324" text-anchor="middle" font-size="12">M: Wärmeproduktion, S: Wärmespeicherung</text>
  <text x="150" y="350" text-anchor="middle" font-size="12">Doppelwand: T_Wand höher → Q_R kleiner</text>
  <text x="150" y="368" text-anchor="middle" font-size="12">hohe Luftfeuchte → Q_E kleiner</text>

  <!-- Rechtes Feld: Regelkreis -->
  <text x="445" y="54" text-anchor="middle" font-size="14" font-weight="600">Temperaturregelkreis</text>
  <rect x="305" y="74" width="70" height="36" rx="5" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="340" y="97" text-anchor="middle">T_soll</text>
  <circle cx="397" cy="92" r="9" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
  <text x="385" y="84" font-size="12">+</text>
  <text x="403" y="116" font-size="13">−</text>
  <rect x="425" y="74" width="120" height="36" rx="5" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="485" y="97" text-anchor="middle">PID-Regler</text>
  <rect x="425" y="140" width="120" height="36" rx="5" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="485" y="163" text-anchor="middle">Heizung (Triac)</text>
  <rect x="425" y="206" width="120" height="36" rx="5" fill="#f1f5f9" stroke="#0b2545" stroke-width="1.5"/>
  <text x="485" y="229" text-anchor="middle">Inkubator + Kind</text>
  <rect x="305" y="206" width="90" height="36" rx="5" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="350" y="221" text-anchor="middle" font-size="12">Luft- oder</text>
  <text x="350" y="235" text-anchor="middle" font-size="12">Hautfühler</text>
  <rect x="425" y="272" width="120" height="40" rx="5" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="485" y="289" text-anchor="middle" font-size="12">Unabhängiger</text>
  <text x="485" y="303" text-anchor="middle" font-size="12">Schutzkreis</text>

  <line x1="375" y1="92" x2="386" y2="92" stroke="#0b2545" stroke-width="1.5" marker-end="url(#inp-ax)"/>
  <line x1="406" y1="92" x2="423" y2="92" stroke="#0b2545" stroke-width="1.5" marker-end="url(#inp-ax)"/>
  <text x="414" y="70" text-anchor="middle" font-size="12">e</text>
  <line x1="485" y1="110" x2="485" y2="138" stroke="#0b2545" stroke-width="1.5" marker-end="url(#inp-ax)"/>
  <text x="492" y="128" font-size="12">u</text>
  <line x1="485" y1="176" x2="485" y2="204" stroke="#0d9488" stroke-width="2" marker-end="url(#inp-arr)"/>
  <text x="492" y="195" font-size="12">Wärme P</text>
  <line x1="425" y1="224" x2="397" y2="224" stroke="#0b2545" stroke-width="1.5" marker-end="url(#inp-ax)"/>
  <polyline points="350,206 350,150 397,150 397,103" fill="none" stroke="#0b2545" stroke-width="1.5" marker-end="url(#inp-ax)"/>
  <text x="356" y="144" font-size="12">T_ist</text>
  <line x1="485" y1="242" x2="485" y2="270" stroke="#0d9488" stroke-width="1.5" marker-end="url(#inp-arr)"/>
  <text x="492" y="261" font-size="12">2. Fühler</text>
  <polyline points="545,292 575,292 575,158 547,158" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#inp-arr)"/>
  <text x="590" y="230" font-size="12" transform="rotate(-90 590 230)" text-anchor="middle">Abschaltung</text>
  <line x1="485" y1="312" x2="485" y2="332" stroke="#0b2545" stroke-width="1.5" marker-end="url(#inp-ax)"/>
  <text x="485" y="346" text-anchor="middle" font-size="12">Alarm</text>
  <line x1="398" y1="268" x2="425" y2="240" stroke="#0b2545" stroke-width="1.5" marker-end="url(#inp-ax)"/>
  <text x="305" y="276" font-size="12">Störgrößen</text>
  <text x="305" y="290" font-size="12">(Klappe offen,</text>
  <text x="305" y="304" font-size="12">Raumklima)</text>

  <text x="445" y="378" text-anchor="middle" font-size="12">u = K_P · e + K_I · ∫e dt + K_D · de/dt</text>
</svg>
