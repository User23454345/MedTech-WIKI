<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0b2545">
  <title>Druck- und Flowkurve bei volumenkontrollierter Beatmung</title>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="600">Volumenkontrollierte Beatmung mit konstantem Flow</text>

  <!-- Druckdiagramm: y=170 entspricht 0 mbar, 4 px pro mbar -->
  <rect x="60" y="40" width="380" height="140" fill="#f1f5f9"/>
  <line x1="60" y1="170" x2="440" y2="170" stroke="#0b2545" stroke-width="1.5"/>
  <line x1="60" y1="40" x2="60" y2="180" stroke="#0b2545" stroke-width="1.5"/>
  <text x="54" y="48" text-anchor="end">p</text>
  <text x="30" y="62" text-anchor="middle">mbar</text>
  <line x1="60" y1="150" x2="440" y2="150" stroke="#0b2545" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="110" x2="440" y2="110" stroke="#0b2545" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="70" x2="440" y2="70" stroke="#0b2545" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="54" y="174" text-anchor="end">0</text>
  <text x="54" y="154" text-anchor="end">5</text>
  <text x="54" y="114" text-anchor="end">15</text>
  <text x="54" y="74" text-anchor="end">25</text>
  <polyline points="60,150 90,150 90,110 210,70 210,110 250,110 250,150 440,150" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="210" y1="70" x2="300" y2="62" stroke="#0b2545" stroke-width="1"/>
  <text x="304" y="66">P_peak = 25 mbar</text>
  <line x1="250" y1="110" x2="300" y2="96" stroke="#0b2545" stroke-width="1"/>
  <text x="304" y="100">P_plat = 15 mbar</text>
  <line x1="340" y1="150" x2="356" y2="134" stroke="#0b2545" stroke-width="1"/>
  <text x="360" y="132">PEEP = 5 mbar</text>
  <line x1="225" y1="73" x2="225" y2="107" stroke="#0b2545" stroke-width="1"/>
  <path d="M221,79 L225,73 L229,79 M221,101 L225,107 L229,101" fill="none" stroke="#0b2545" stroke-width="1"/>
  <line x1="225" y1="90" x2="250" y2="128" stroke="#0b2545" stroke-width="1"/>
  <text x="256" y="138" font-size="13">R · V̇</text>
  <line x1="150" y1="90" x2="130" y2="58" stroke="#0b2545" stroke-width="1"/>
  <text x="96" y="54">V / C</text>

  <!-- Flowdiagramm: Nulllinie y=275 -->
  <rect x="60" y="205" width="380" height="140" fill="#f1f5f9"/>
  <line x1="60" y1="275" x2="440" y2="275" stroke="#0b2545" stroke-width="1.5"/>
  <line x1="60" y1="205" x2="60" y2="345" stroke="#0b2545" stroke-width="1.5"/>
  <text x="30" y="218" text-anchor="middle">V̇</text>
  <text x="30" y="234" text-anchor="middle">l/s</text>
  <text x="54" y="279" text-anchor="end">0</text>
  <text x="54" y="239" text-anchor="end">1</text>
  <line x1="56" y1="235" x2="64" y2="235" stroke="#0b2545" stroke-width="1"/>
  <text x="54" y="319" text-anchor="end">−1</text>
  <line x1="56" y1="315" x2="64" y2="315" stroke="#0b2545" stroke-width="1"/>
  <!-- Inspiration konstanter Flow -->
  <polyline points="60,275 90,275 90,235 210,235 210,275 250,275" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- passive Exspiration exponentiell -->
  <polyline points="250,275 250,315.0 260,308.9 270,303.7 280,299.3 290,295.5 300,292.4 310,289.7 320,287.5 330,285.5 340,283.9 350,282.6 360,281.4 370,280.4 380,279.6 390,278.9 400,278.3 410,277.8 420,277.4 430,277.0 440,276.7" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="150" y1="235" x2="150" y2="218" stroke="#0b2545" stroke-width="1"/>
  <text x="100" y="214">Inspiration: V̇ = 1 l/s</text>
  <line x1="230" y1="275" x2="230" y2="300" stroke="#0b2545" stroke-width="1"/>
  <text x="182" y="316">Pause</text>
  <line x1="300" y1="292" x2="320" y2="318" stroke="#0b2545" stroke-width="1"/>
  <text x="300" y="334">Exspiration (τ = R · C)</text>
  <text x="440" y="362" text-anchor="end">Zeit t</text>

  <!-- Formelkasten -->
  <rect x="458" y="60" width="128" height="250" rx="8" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="522" y="84" text-anchor="middle" font-weight="600">Bewegungs-</text>
  <text x="522" y="100" text-anchor="middle" font-weight="600">gleichung</text>
  <text x="522" y="128" text-anchor="middle">P = V / C</text>
  <text x="522" y="146" text-anchor="middle">+ R · V̇</text>
  <text x="522" y="164" text-anchor="middle">+ PEEP</text>
  <line x1="472" y1="180" x2="572" y2="180" stroke="#0b2545" stroke-width="1"/>
  <text x="522" y="202" text-anchor="middle">Beispiel:</text>
  <text x="522" y="222" text-anchor="middle">V_T = 500 ml</text>
  <text x="522" y="240" text-anchor="middle">C = 50 ml/mbar</text>
  <text x="522" y="258" text-anchor="middle">R = 10 mbar·s/l</text>
  <text x="522" y="276" text-anchor="middle">V̇ = 1 l/s</text>
  <text x="522" y="294" text-anchor="middle">τ = 0,5 s</text>
  <text x="300" y="388" text-anchor="middle" font-size="13">Beispielwerte, schematisch – nicht maßstäblich zu einem realen Gerät</text>
</svg>
