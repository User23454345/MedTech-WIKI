    <line x1="220" y1="80" x2="220" y2="200"/>
  </g>
  <text x="250" y="88" font-size="13">I₀</text>
  <!-- Objekt -->
  <ellipse cx="130" cy="140" rx="82" ry="40" fill="#f1f5f9" stroke="#0b2545" stroke-width="1.5"/>
  <circle cx="100" cy="140" r="14" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <circle cx="165" cy="138" r="9" fill="#0b2545"/>
  <text x="250" y="145" font-size="13">μ(x, y)</text>
  <!-- Detektorzeile -->
  <rect x="30" y="204" width="200" height="8" fill="#0b2545"/>
  <text x="250" y="212" font-size="13">I</text>
  <!-- Profil -->
  <polyline points="30,262 48,262 58,250 80,236 100,228 120,236 140,240 158,222 172,222 186,240 204,250 214,262 230,262" fill="none" stroke="#0d9488" stroke-width="2"/>
  <line x1="30" y1="262" x2="236" y2="262" stroke="#0b2545" stroke-width="1" marker-end="url(#arrd)"/>
  <text x="242" y="266" font-size="13">t</text>
  <text x="130" y="284" text-anchor="middle" font-size="13">p(θ, t) = ln(I₀ / I) = ∫ μ ds</text>

