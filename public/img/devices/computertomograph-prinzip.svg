  <!-- 1: Projektion -->
  <text x="150" y="50" text-anchor="middle" font-size="14" font-weight="600">1  Projektion unter Winkel θ</text>
  <!-- Strahlen -->
  <g stroke="#14b8a6" stroke-width="1.2">
