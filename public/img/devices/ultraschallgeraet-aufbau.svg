<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Inter, Arial, sans-serif">
  <title>Ultraschallgerät – schematischer Aufbau von Schallkopf und Grundgerät</title>
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <text x="300" y="26" font-size="15" font-weight="600" fill="#0b2545" text-anchor="middle">Aufbau eines Ultraschallsystems (schematisch)</text>

  <!-- Panel A: Schallkopf im Schnitt -->
  <g transform="translate(-15,0)">
  <text x="165" y="52" font-size="14" font-weight="600" fill="#0b2545" text-anchor="middle">A  Linear-Array im Schnitt</text>
  <!-- Kabel -->
  <path d="M110,70 L110,92" stroke="#0b2545" stroke-width="6" fill="none"/>
  <!-- Gehäuse -->
  <path d="M70,92 L150,92 L160,130 L160,300 L60,300 L60,130 Z" fill="#f1f5f9" stroke="#0b2545" stroke-width="2"/>
  <!-- Backing -->
  <rect x="68" y="190" width="84" height="60" fill="#cbd5e1" stroke="#0b2545" stroke-width="1.5"/>
  <!-- Piezoelemente -->
  <g fill="#14b8a6" stroke="#0b2545" stroke-width="1">
    <rect x="68" y="250" width="9" height="16"/><rect x="79" y="250" width="9" height="16"/>
    <rect x="90" y="250" width="9" height="16"/><rect x="101" y="250" width="9" height="16"/>
    <rect x="112" y="250" width="9" height="16"/><rect x="123" y="250" width="9" height="16"/>
    <rect x="134" y="250" width="9" height="16"/><rect x="145" y="250" width="7" height="16"/>
  </g>
  <!-- Anpassschicht -->
  <rect x="68" y="266" width="84" height="8" fill="#e6f7f5" stroke="#0b2545" stroke-width="1"/>
  <!-- Linse -->
  <path d="M60,274 L160,274 L160,292 Q110,316 60,292 Z" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <!-- Verdrahtung -->
  <g stroke="#0b2545" stroke-width="1" fill="none">
    <path d="M90,190 L104,120 L108,96"/><path d="M110,190 L110,96"/><path d="M130,190 L116,120 L112,96"/>
  </g>
  <!-- Haut / Gel -->
  <path d="M40,318 Q110,330 180,318" stroke="#0d9488" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <text x="110" y="350" font-size="13" fill="#0b2545" text-anchor="middle">Koppelgel / Haut</text>

  <!-- Beschriftungen A -->
  <g stroke="#0b2545" stroke-width="1">
    <line x1="114" y1="80" x2="200" y2="80"/>
    <line x1="140" y1="140" x2="200" y2="140"/>
    <line x1="152" y1="220" x2="200" y2="200"/>
    <line x1="150" y1="258" x2="200" y2="240"/>
    <line x1="152" y1="270" x2="200" y2="280"/>
    <line x1="150" y1="296" x2="200" y2="318"/>
  </g>
  <g font-size="13" fill="#0b2545">
    <text x="204" y="84">Kabel</text>
    <text x="204" y="144">Gehäuse</text>
    <text x="204" y="204">Dämpfungskörper</text>
    <text x="204" y="244">Piezoelemente</text>
    <text x="204" y="284">Anpassschicht λ/4</text>
    <text x="204" y="322">Linse</text>
  </g>
</g>

  <!-- Trennlinie -->
  <line x1="318" y1="44" x2="318" y2="380" stroke="#e2e8f0" stroke-width="2"/>

  <g transform="translate(30,0)">
  <!-- Panel B: Grundgerät -->
  <text x="470" y="52" font-size="14" font-weight="600" fill="#0b2545" text-anchor="middle">B  Konsolensystem</text>
  <!-- Monitor -->
  <rect x="420" y="66" width="120" height="78" rx="4" fill="#f1f5f9" stroke="#0b2545" stroke-width="2"/>
  <path d="M440,82 L520,82 L540,132 L420,132 Z" fill="#0b2545" opacity="0.15"/>
  <path d="M480,90 L455,128 L505,128 Z" fill="#14b8a6" opacity="0.7"/>
  <line x1="480" y1="144" x2="480" y2="160" stroke="#0b2545" stroke-width="3"/>
  <!-- Bedienpult -->
  <rect x="404" y="160" width="152" height="38" rx="5" fill="#e6f7f5" stroke="#0b2545" stroke-width="2"/>
  <circle cx="430" cy="179" r="8" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
  <g stroke="#0d9488" stroke-width="2"><line x1="452" y1="170" x2="452" y2="190"/><line x1="462" y1="170" x2="462" y2="190"/><line x1="472" y1="170" x2="472" y2="190"/><line x1="482" y1="170" x2="482" y2="190"/></g>
  <rect x="496" y="168" width="50" height="22" rx="3" fill="#ffffff" stroke="#0b2545" stroke-width="1.2"/>
  <!-- Elektronikeinschub -->
  <rect x="420" y="208" width="120" height="122" rx="4" fill="#f1f5f9" stroke="#0b2545" stroke-width="2"/>
  <rect x="430" y="218" width="100" height="24" fill="#ffffff" stroke="#0b2545" stroke-width="1"/>
  <rect x="430" y="248" width="100" height="24" fill="#ffffff" stroke="#0b2545" stroke-width="1"/>
  <rect x="430" y="278" width="100" height="24" fill="#ffffff" stroke="#0b2545" stroke-width="1"/>
  <g fill="#0d9488"><rect x="532" y="222" width="6" height="16"/><rect x="532" y="252" width="6" height="16"/></g>
  <!-- Rollen -->
  <line x1="420" y1="330" x2="420" y2="350" stroke="#0b2545" stroke-width="2"/>
  <line x1="540" y1="330" x2="540" y2="350" stroke="#0b2545" stroke-width="2"/>
  <circle cx="420" cy="356" r="7" fill="#ffffff" stroke="#0b2545" stroke-width="2"/>
  <circle cx="540" cy="356" r="7" fill="#ffffff" stroke="#0b2545" stroke-width="2"/>

  <!-- Beschriftungen B -->
  <g stroke="#0b2545" stroke-width="1">
    <line x1="420" y1="100" x2="380" y2="100"/>
    <line x1="404" y1="179" x2="380" y2="179"/>
    <line x1="430" y1="230" x2="380" y2="230"/>
    <line x1="430" y1="290" x2="380" y2="290"/>
    <line x1="538" y1="260" x2="548" y2="370"/>
  </g>
  <g font-size="13" fill="#0b2545" text-anchor="end">
    <text x="376" y="96">Monitor</text>
    <text x="376" y="175">Bedienpult</text>
    <text x="376" y="191">(TGC, Trackball)</text>
    <text x="376" y="226">Frontend</text>
    <text x="376" y="242">Sende/Empfang</text>
    <text x="376" y="286">Bildrechner,</text>
    <text x="376" y="302">Netzteil</text>
  </g>
  <text x="556" y="388" font-size="13" fill="#0d9488" text-anchor="end">Schallkopfanschlüsse</text>
  </g>
</svg>
