<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Inter, Arial, sans-serif">
  <title>Patientenmonitor – Messprinzip: Signalkette und Oszillometrie</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b2545"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <text x="300" y="30" font-size="15" font-weight="600" fill="#0b2545" text-anchor="middle">A  Messkette eines Parameterkanals</text>
  <rect x="15" y="50" width="100" height="46" rx="6" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="65" y="69" font-size="13" fill="#0b2545" text-anchor="middle">Elektrode /</text>
  <text x="65" y="85" font-size="13" fill="#0b2545" text-anchor="middle">Sensor</text>
  <text x="65" y="114" font-size="13" fill="#0d9488" text-anchor="middle">µV bis mV</text>
  <line x1="115" y1="73" x2="128" y2="73" stroke="#0b2545" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="132" y="50" width="100" height="46" rx="6" fill="#f1f5f9" stroke="#0b2545" stroke-width="1.5"/>
  <text x="182" y="69" font-size="13" fill="#0b2545" text-anchor="middle">Instrumenten-</text>
  <text x="182" y="85" font-size="13" fill="#0b2545" text-anchor="middle">verstärker</text>
  <text x="182" y="114" font-size="13" fill="#0d9488" text-anchor="middle">Differenzsignal</text>
  <line x1="232" y1="73" x2="245" y2="73" stroke="#0b2545" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="249" y="50" width="100" height="46" rx="6" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="299" y="69" font-size="13" fill="#0b2545" text-anchor="middle">Analoge</text>
  <text x="299" y="85" font-size="13" fill="#0b2545" text-anchor="middle">Filter</text>
  <text x="299" y="114" font-size="13" fill="#0d9488" text-anchor="middle">Bandbegrenzung</text>
  <line x1="349" y1="73" x2="362" y2="73" stroke="#0b2545" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="366" y="50" width="100" height="46" rx="6" fill="#f1f5f9" stroke="#0b2545" stroke-width="1.5"/>
  <text x="416" y="69" font-size="13" fill="#0b2545" text-anchor="middle">A/D-</text>
  <text x="416" y="85" font-size="13" fill="#0b2545" text-anchor="middle">Wandler</text>
  <text x="416" y="114" font-size="13" fill="#0d9488" text-anchor="middle">Abtastung</text>
  <line x1="466" y1="73" x2="479" y2="73" stroke="#0b2545" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="483" y="50" width="100" height="46" rx="6" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="533" y="69" font-size="13" fill="#0b2545" text-anchor="middle">Isolation +</text>
  <text x="533" y="85" font-size="13" fill="#0b2545" text-anchor="middle">Prozessor</text>
  <text x="533" y="114" font-size="13" fill="#0d9488" text-anchor="middle">Analyse, Alarme</text>
  <line x1="15" y1="128" x2="585" y2="128" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="150" font-size="15" font-weight="600" fill="#0b2545" text-anchor="middle">B  Oszillometrische Blutdruckmessung (vereinfacht)</text>
  <!-- Achsen -->
  <line x1="70" y1="350" x2="560" y2="350" stroke="#0b2545" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <line x1="70" y1="350" x2="70" y2="160" stroke="#0b2545" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <text x="58" y="255" font-size="13" fill="#0b2545" text-anchor="middle" transform="rotate(-90 58 255)">Druck</text>
  <text x="556" y="368" font-size="13" fill="#0b2545" text-anchor="end">Zeit</text>
  <!-- Manschettendruck -->
  <polyline points="80,168 530,248" fill="none" stroke="#0b2545" stroke-width="2"/>
  <text x="430" y="192" font-size="13" fill="#0b2545">Manschettendruck</text>
  <text x="430" y="208" font-size="13" fill="#0b2545">(Ablassphase)</text>
  <!-- Oszillationen -->
  <g stroke="#0d9488" stroke-width="4" stroke-linecap="round">
    <line x1="90" y1="350" x2="90" y2="346"/>
    <line x1="106" y1="350" x2="106" y2="346"/>
    <line x1="122" y1="350" x2="122" y2="345"/>
    <line x1="138" y1="350" x2="138" y2="343"/>
    <line x1="154" y1="350" x2="154" y2="340"/>
    <line x1="170" y1="350" x2="170" y2="335"/>
    <line x1="186" y1="350" x2="186" y2="329"/>
    <line x1="202" y1="350" x2="202" y2="321"/>
    <line x1="218" y1="350" x2="218" y2="311"/>
    <line x1="234" y1="350" x2="234" y2="301"/>
    <line x1="250" y1="350" x2="250" y2="290"/>
    <line x1="266" y1="350" x2="266" y2="281"/>
    <line x1="282" y1="350" x2="282" y2="275"/>
    <line x1="298" y1="350" x2="298" y2="272"/>
    <line x1="314" y1="350" x2="314" y2="274"/>
    <line x1="330" y1="350" x2="330" y2="279"/>
    <line x1="346" y1="350" x2="346" y2="288"/>
    <line x1="362" y1="350" x2="362" y2="298"/>
    <line x1="378" y1="350" x2="378" y2="309"/>
    <line x1="394" y1="350" x2="394" y2="319"/>
    <line x1="410" y1="350" x2="410" y2="327"/>
    <line x1="426" y1="350" x2="426" y2="334"/>
    <line x1="442" y1="350" x2="442" y2="339"/>
    <line x1="458" y1="350" x2="458" y2="342"/>
    <line x1="474" y1="350" x2="474" y2="344"/>
    <line x1="490" y1="350" x2="490" y2="346"/>
    <line x1="506" y1="350" x2="506" y2="346"/>
    <line x1="522" y1="350" x2="522" y2="347"/>
  </g>
  <text x="80" y="262" font-size="13" fill="#0d9488">Oszillations-</text>
  <text x="80" y="278" font-size="13" fill="#0d9488">amplitude</text>
  <!-- Marker -->
  <g stroke="#0b2545" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="218" y1="352" x2="218" y2="183"/>
    <line x1="298" y1="352" x2="298" y2="183"/>
    <line x1="362" y1="352" x2="362" y2="183"/>
  </g>
  <g font-size="13" fill="#0b2545" text-anchor="middle" font-weight="600">
    <text x="218" y="368">SYS</text>
    <text x="298" y="368">MAP</text>
    <text x="362" y="368">DIA</text>
  </g>
  <text x="20" y="392" font-size="13" fill="#0b2545">MAP ≈ Druck bei maximaler Amplitude; SYS/DIA herstellerspezifisch abgeleitet</text>
</svg>
