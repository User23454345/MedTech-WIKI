<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0b2545">
  <title>Schematischer Aufbau eines monopolaren HF-Chirurgie-Arbeitsplatzes</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b2545"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="600">Aufbau eines HF-Chirurgie-Arbeitsplatzes (Schema)</text>

  <!-- Generatorgehäuse -->
  <rect x="20" y="46" width="250" height="222" rx="10" fill="#f1f5f9" stroke="#0b2545" stroke-width="2"/>
  <text x="145" y="66" text-anchor="middle" font-size="13" font-weight="600">HF-Generator</text>

  <!-- Display -->
  <rect x="34" y="78" width="110" height="62" rx="5" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
  <text x="89" y="100" text-anchor="middle" font-size="13">Modus</text>
  <text x="89" y="120" text-anchor="middle" font-size="13">Effekt · Watt</text>

  <!-- Innenleben -->
  <rect x="150" y="78" width="112" height="26" rx="4" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
  <text x="206" y="96" text-anchor="middle" font-size="13">Netzteil</text>
  <rect x="150" y="112" width="112" height="26" rx="4" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="206" y="130" text-anchor="middle" font-size="13">HF-Endstufe</text>
  <rect x="150" y="146" width="112" height="26" rx="4" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="206" y="164" text-anchor="middle" font-size="13">Trafo · Koppel-C</text>
  <rect x="34" y="150" width="110" height="26" rx="4" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
  <text x="89" y="168" text-anchor="middle" font-size="13">Regelung (µC)</text>
  <line x1="206" y1="104" x2="206" y2="112" stroke="#0b2545" stroke-width="1.5"/>
  <line x1="206" y1="138" x2="206" y2="146" stroke="#0b2545" stroke-width="1.5"/>
  <line x1="144" y1="163" x2="150" y2="163" stroke="#0b2545" stroke-width="1.5"/>

  <!-- Buchsen -->
  <circle cx="60" cy="222" r="12" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
  <circle cx="60" cy="222" r="4" fill="#0d9488"/>
  <text x="60" y="202" text-anchor="middle" font-size="13">mono</text>
  <circle cx="140" cy="222" r="12" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
  <circle cx="136" cy="222" r="3" fill="#0b2545"/>
  <circle cx="144" cy="222" r="3" fill="#0b2545"/>
  <text x="140" y="202" text-anchor="middle" font-size="13">bipolar</text>
  <rect x="200" y="210" width="40" height="24" rx="4" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
  <circle cx="212" cy="222" r="3" fill="#0b2545"/>
  <circle cx="228" cy="222" r="3" fill="#0b2545"/>
  <text x="220" y="202" text-anchor="middle" font-size="13">NE</text>

  <!-- Fußschalter -->
  <rect x="40" y="320" width="120" height="40" rx="8" fill="#f1f5f9" stroke="#0b2545" stroke-width="1.5"/>
  <rect x="52" y="330" width="44" height="20" rx="4" fill="#ffffff" stroke="#0b2545" stroke-width="1.2"/>
  <rect x="104" y="330" width="44" height="20" rx="4" fill="#14b8a6" stroke="#0b2545" stroke-width="1.2"/>
  <text x="100" y="382" text-anchor="middle" font-size="13">Fußschalter (Schneiden/Koag.)</text>
  <path d="M100,320 C100,300 110,290 110,268" fill="none" stroke="#0b2545" stroke-width="1.5"/>

  <!-- OP-Tisch und Patient -->
  <rect x="300" y="300" width="280" height="12" rx="3" fill="#f1f5f9" stroke="#0b2545" stroke-width="1.5"/>
  <line x1="440" y1="312" x2="440" y2="352" stroke="#0b2545" stroke-width="2"/>
  <rect x="400" y="352" width="80" height="10" rx="2" fill="#f1f5f9" stroke="#0b2545" stroke-width="1.5"/>
  <path d="M320,300 C320,268 346,256 380,258 L540,262 C566,264 574,280 570,300 Z" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <circle cx="312" cy="276" r="18" fill="#e6f7f5" stroke="#0b2545" stroke-width="1.5"/>
  <text x="440" y="384" text-anchor="middle" font-size="13">Patient auf OP-Tisch (isoliert gelagert)</text>

  <!-- Neutralelektrode am Oberschenkel -->
  <rect x="500" y="266" width="44" height="14" rx="3" fill="#14b8a6" stroke="#0b2545" stroke-width="1.2"/>
  <line x1="522" y1="266" x2="522" y2="280" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="544" y1="273" x2="566" y2="226" stroke="#0b2545" stroke-width="1"/>
  <text x="566" y="208" text-anchor="middle" font-size="13">Neutral-</text>
  <text x="566" y="222" text-anchor="middle" font-size="13">elektrode</text>

  <!-- Handgriff / Aktivelektrode -->
  <path d="M60,234 C60,300 260,300 330,170" fill="none" stroke="#0d9488" stroke-width="2"/>
  <rect x="330" y="150" width="90" height="16" rx="7" fill="#f1f5f9" stroke="#0b2545" stroke-width="1.5" transform="rotate(30 330 150)"/>
  <line x1="405" y1="195" x2="424" y2="248" stroke="#0b2545" stroke-width="2.5"/>
  <circle cx="425" cy="252" r="3" fill="#0d9488"/>
  <line x1="430" y1="200" x2="470" y2="150" stroke="#0b2545" stroke-width="1"/>
  <text x="476" y="134" font-size="13">Handgriff mit</text>
  <text x="476" y="150" font-size="13">Aktivelektrode</text>

  <!-- Rückleitung -->
  <path d="M212,234 C240,330 470,250 500,273" fill="none" stroke="#0b2545" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Stromfluss -->
  <path d="M432,262 C455,280 478,282 498,276" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="300" y="100" font-size="13" fill="#0d9488">HF-Strom: Aktivelektrode</text>
  <text x="300" y="116" font-size="13" fill="#0d9488">→ Gewebe → Neutralelektrode</text>
  <text x="300" y="132" font-size="13" fill="#0d9488">→ zurück zum Generator</text>
</svg>
